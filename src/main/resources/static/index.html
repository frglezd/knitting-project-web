<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knitting Catalog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Knitting Catalog</h1>
    <div class="controls">
      <input id="search-input" type="search" placeholder="Search by name...">
      <button id="add-toggle">+ Add item</button>
    </div>
  </header>

  <form id="add-form" class="add-form" hidden>
    <div class="field"><label>Nombre<input name="nombre" type="text" required></label></div>
    <div class="field"><label>Categoria<input name="categoria" type="text" required></label></div>
    <div class="field"><label>Fabricante<input name="fabricante" type="text" required></label></div>
    <div class="field"><label>Precio<input name="precio" type="number" step="0.01" required></label></div>
    <div class="field"><label>Unidad precio<input name="unidadPrecio" type="text" required placeholder="e.g. per skein"></label></div>
    <div class="field"><label>Imagen (URL)<input name="imagen" type="text"></label></div>
    <div class="field wide"><label>Descripcion<textarea name="descripcion"></textarea></label></div>
    <div class="form-actions">
      <button type="submit">Save</button>
      <button type="button" id="add-cancel">Cancel</button>
    </div>
  </form>

  <p id="status"></p>
  <div id="catalog" class="catalog"></div>

  <script src="app.js"></script>
</body>
</html>
